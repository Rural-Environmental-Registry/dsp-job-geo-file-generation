# Local demo YAML. The runtime file comes from rer-dsp-core
# (config/Job-Geo-File-Generation/application/application.yaml) via SPRING_CONFIG_LOCATION.
spring:
  application:
    name: dsp-geo-file-generation
  main:
    web-application-type: none
  datasource:
    batch:
      url: jdbc:postgresql://localhost:20654/dsp-db?currentSchema=geo_file_generation
      username: dsp
      password: dsp
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        pool-name: batch-pool
        connection-test-query: SELECT 1
    target:
      url: jdbc:postgresql://localhost:20654/dsp-db
      username: dsp
      password: dsp
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        pool-name: target-pool
    geo-target:
      url: jdbc:postgresql://localhost:20656/dsp-geoserver-db
      username: dsp_geo
      password: dsp_geo
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        pool-name: geo-target-pool
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

dsp:
  download:
    # Same catalogue the backend reads: themes and the formats to pre-generate.
    themes-file: file:../rer-dsp-core/config/downloads/downloadThemesConfig.json
  object-storage:
    # S3 API endpoint. The bucket must already exist — the job never creates it.
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: dsp-geo-files
    access-key: dsp
    secret-key: dsp-secret
    path-style-access: true

geo-file-generation:
  chunk-size: 1
  orphan-cleanup-enabled: true
  staging-dir: /tmp/dsp-geo-files

execution-jobs:
  geo-file-generation-job: true

logging:
  level:
    br.car.dsp_geo_file: INFO
