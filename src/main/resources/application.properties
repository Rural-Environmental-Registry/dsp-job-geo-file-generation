spring.application.name=dsp-geo-file-generation
spring.main.web-application-type=none

# Spring Batch metadata (schema geo_file_generation). Override URLs/credentials via env in Docker.
spring.datasource.batch.url=${SPRING_DATASOURCE_BATCH_URL:jdbc:postgresql://localhost:20654/dsp-db?currentSchema=geo_file_generation}
spring.datasource.batch.username=${SPRING_DATASOURCE_BATCH_USERNAME:dsp}
spring.datasource.batch.password=${SPRING_DATASOURCE_BATCH_PASSWORD:dsp}
spring.datasource.batch.driver-class-name=org.postgresql.Driver
spring.datasource.batch.hikari.maximum-pool-size=5
spring.datasource.batch.hikari.minimum-idle=1
spring.datasource.batch.hikari.pool-name=batch-pool
spring.datasource.batch.hikari.connection-test-query=SELECT 1

# Territorial regeneration flags on dsp-db.
spring.datasource.target.url=${SPRING_DATASOURCE_TARGET_URL:jdbc:postgresql://localhost:20654/dsp-db}
spring.datasource.target.username=${SPRING_DATASOURCE_TARGET_USERNAME:dsp}
spring.datasource.target.password=${SPRING_DATASOURCE_TARGET_PASSWORD:dsp}
spring.datasource.target.driver-class-name=org.postgresql.Driver
spring.datasource.target.hikari.maximum-pool-size=5
spring.datasource.target.hikari.minimum-idle=1
spring.datasource.target.hikari.pool-name=target-pool

# Features to export (same base as download WFS).
spring.datasource.geo-target.url=${SPRING_DATASOURCE_GEO_TARGET_URL:jdbc:postgresql://localhost:20656/dsp-geoserver-db}
spring.datasource.geo-target.username=${SPRING_DATASOURCE_GEO_TARGET_USERNAME:dsp_geo}
spring.datasource.geo-target.password=${SPRING_DATASOURCE_GEO_TARGET_PASSWORD:dsp_geo}
spring.datasource.geo-target.driver-class-name=org.postgresql.Driver
spring.datasource.geo-target.hikari.maximum-pool-size=10
spring.datasource.geo-target.hikari.minimum-idle=2
spring.datasource.geo-target.hikari.pool-name=geo-target-pool

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# Same catalogue as the backend — source of truth is this repo config/downloads/ (not packaged in this jar).
# Docker/Compose sets DSP_DOWNLOAD_THEMES_FILE=file:/config/downloadThemesConfig.json
dsp.download.themes-file=${DSP_DOWNLOAD_THEMES_FILE:file:config/downloads/downloadThemesConfig.json}

# Object storage (S3 API). The bucket must already exist — the job never creates it.
dsp.object-storage.endpoint=${DSP_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
dsp.object-storage.region=${DSP_OBJECT_STORAGE_REGION:us-east-1}
dsp.object-storage.bucket=${DSP_OBJECT_STORAGE_BUCKET:dsp-geo-files}
dsp.object-storage.access-key=${DSP_OBJECT_STORAGE_ACCESS_KEY:dsp}
dsp.object-storage.secret-key=${DSP_OBJECT_STORAGE_SECRET_KEY:dsp-secret}
dsp.object-storage.path-style-access=${DSP_OBJECT_STORAGE_PATH_STYLE_ACCESS:true}

geo-file-generation.chunk-size=1
geo-file-generation.orphan-cleanup-enabled=true
geo-file-generation.staging-dir=/tmp/dsp-geo-files

execution-jobs.geo-file-generation-job=true

logging.level.br.car.dsp_geo_file=INFO
